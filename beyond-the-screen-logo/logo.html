<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../reel-file-delete-telugu/src/fonts/fonts.css">
<style>html,body{margin:0;background:transparent}svg{display:block}</style></head><body>
<svg id="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1080" height="1080">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.75"><stop offset="0" stop-color="#1F2A5C"/><stop offset="0.6" stop-color="#10163A"/><stop offset="1" stop-color="#070A1C"/></radialGradient>
    <linearGradient id="frame" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FFE14D" stop-opacity="0"/><stop offset="0.35" stop-color="#FFE14D"/><stop offset="1" stop-color="#FFB020"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFE14D" stop-opacity="0.55"/><stop offset="1" stop-color="#FFE14D" stop-opacity="0"/></radialGradient>
    <mask id="gap"><rect width="1000" height="1000" fill="#fff"/><circle cx="__GX__" cy="__GY__" r="92" fill="#000" transform="translate(0 0)"/></mask>
  </defs>
  <rect id="bgrect" width="1000" height="1000" fill="url(#bg)"/>
  <g transform="translate(-45 __DY__)">
    <!-- screen with a broken top-right corner -->
    <g mask="url(#gap)">
      <rect x="330" y="250" width="300" height="500" rx="58" fill="rgba(34,211,238,0.06)" stroke="url(#frame)" stroke-width="34"/>
      <rect x="440" y="282" width="80" height="14" rx="7" fill="#A78BFA" opacity="0.8"/>
    </g>
    <!-- content lines inside the screen -->
    <rect x="378" y="560" width="150" height="20" rx="10" fill="#22D3EE" opacity="0.55"/>
    <rect x="378" y="604" width="105" height="20" rx="10" fill="#22D3EE" opacity="0.35"/>
    <rect x="378" y="648" width="128" height="20" rx="10" fill="#22D3EE" opacity="0.25"/>
    <!-- arrow breaking out beyond the screen -->
    <circle cx="690" cy="300" r="150" fill="url(#glow)"/>
    <path d="M440 510 L736 214" stroke="url(#beam)" stroke-width="46" stroke-linecap="round"/>
    <path d="M598 196 L752 196 L752 350" fill="none" stroke="#FFE14D" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- sparks -->
    <circle cx="815" cy="150" r="13" fill="#FFE14D"/><circle cx="845" cy="250" r="8" fill="#22D3EE"/><circle cx="740" cy="110" r="8" fill="#A78BFA"/>
  </g>
  <g id="word">
    <text x="500" y="872" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="84" letter-spacing="6" fill="#FFFFFF">BEYOND</text>
    <text x="500" y="940" text-anchor="middle" font-family="Poppins" font-weight="600" font-size="46" letter-spacing="15" fill="#FFE14D">THE SCREEN</text>
  </g>
