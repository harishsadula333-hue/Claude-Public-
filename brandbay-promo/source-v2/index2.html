// glitch text: main + red/cyan split + displaced slice
function gtxt(text,mainStyle,size){
 const base=`font-size:${size}px;${mainStyle}`;
 const solid=`font-size:${size}px;font-weight:900;`;
 const el=mk(`<div style="position:relative">
  <div class="gl r" style="${solid}color:#ff2a6a">${text}</div>
  <div class="gl c" style="${solid}color:#22d3ff">${text}</div>
  <div class="m" style="position:relative;${base}">${text}</div>
  <div class="gl sl" style="${base}">${text}</div></div>`);
 return {el,r:el.querySelector('.r'),c:el.querySelector('.c'),m:el.querySelector('.m'),sl:el.querySelector('.sl')};
}
function setGlitch(g,t,amt){
 const f=Math.floor(t*30);
 const a=amt*(0.5+hash(f));
 g.r.style.transform=`translate(${(hash(f+1)-0.5)*44*a+ -6*a}px,${(hash(f+2)-0.5)*14*a}px)`;
 g.c.style.transform=`translate(${(hash(f+3)-0.5)*44*a+6*a}px,${(hash(f+4)-0.5)*14*a}px)`;
 g.r.style.opacity=g.c.style.opacity=clamp(amt*1.5);
 if(amt>0.1){const y0=hash(f+5)*80;g.sl.style.clipPath=`inset(${y0}% 0 ${Math.max(0,100-y0-12-hash(f+6)*18)}% 0)`;g.sl.style.transform=`translateX(${(hash(f+7)-0.5)*90*amt}px)`;g.sl.style.opacity=1}
 else g.sl.style.opacity=0;
}
