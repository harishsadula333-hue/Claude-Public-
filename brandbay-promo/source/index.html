<!doctype html>
<html><head><meta charset="utf-8"><title>Brand Bay Promo</title>
<link rel="stylesheet" href="fonts/local.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#05071a}
#stage{position:absolute;inset:0;overflow:hidden;font-family:'Montserrat',sans-serif;color:#fff}
canvas{position:absolute;inset:0}
.a{position:absolute;left:540px;top:960px;transform-origin:50% 50%;white-space:nowrap;will-change:transform,opacity}
.grad{background:linear-gradient(90deg,#ff7a1a,#ff3d8b 50%,#3d6bff);}
.gtext{-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{border-radius:999px;padding:22px 60px;font-weight:800;letter-spacing:.16em;box-shadow:0 20px 60px rgba(255,61,139,.35)}
.lam{display:inline-block;height:.7em;width:.74em;vertical-align:0}
.wm{font-weight:700;letter-spacing:.07em}
.wm span{display:inline-block}
.sub{font-family:'Poppins';font-weight:500}
.card{width:860px;height:980px;border-radius:52px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.03));border:2px solid rgba(255,255,255,.16);box-shadow:0 50px 140px rgba(0,0,0,.55);white-space:normal}
.card .num{position:absolute;left:56px;top:40px;font-size:120px;font-weight:900;color:transparent;-webkit-text-stroke:2.5px rgba(255,255,255,.35)}
.card .of{position:absolute;right:60px;top:70px;font-size:34px;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:.1em}
.card .ic{position:absolute;left:50%;top:330px;width:320px;height:320px;margin:-160px 0 0 -160px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.card .ic svg{width:170px;height:170px}
.card .tt{position:absolute;left:0;right:0;top:560px;text-align:center;font-size:64px;font-weight:800;line-height:1.12;letter-spacing:.02em}
.card .ds{position:absolute;left:0;right:0;top:770px;text-align:center;font-family:'Poppins';font-weight:500;font-size:38px;color:rgba(255,255,255,.78)}
.card .bar{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);display:flex;gap:10px}
.card .bar i{display:block;width:56px;height:8px;border-radius:4px;background:rgba(255,255,255,.18)}
.tile{width:300px;height:300px;border-radius:34px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:2px solid rgba(255,255,255,.14);white-space:normal;text-align:center}
.tile .ic{width:120px;height:120px;border-radius:50%;margin:34px auto 22px;display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:66px;height:66px}
.tile .nm{font-size:24px;font-weight:700;line-height:1.2;padding:0 18px;letter-spacing:.02em}
.portrait{width:640px;height:680px;border-radius:48px;padding:9px}
.portrait .in{width:100%;height:100%;border-radius:40px;overflow:hidden;background:#fff;position:relative}
.portrait img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 0;transform-origin:50% 30%}
.row{display:flex;align-items:center;gap:28px;font-family:'Poppins';font-weight:500;font-size:40px}
.row .dot{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.row .dot svg{width:44px;height:44px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.6) 100%);pointer-events:none}
#grain{position:absolute;inset:-200px;opacity:.07;pointer-events:none;mix-blend-mode:overlay}
.outline{color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.08);font-weight:900}
</style></head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div id="world" class="a" style="left:0;top:0;width:1080px;height:1920px;transform-origin:540px 960px">
  </div>
  <div id="wipe" class="a" style="width:2400px;height:2600px;opacity:0"></div>
  <div id="flash"></div>
  <div id="vig"></div>
  <div id="grain"></div>
</div>
<script>
const W=1080,H=1920;
const $=s=>document.querySelector(s);
const world=$('#world');
function mk(html,cls='a',style=''){const d=document.createElement('div');d.className=cls;d.style.cssText=style;d.innerHTML=html;world.appendChild(d);return d}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const E={
 lin:x=>x,
 oC:x=>1-Math.pow(1-x,3), iC:x=>x*x*x, ioC:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 oE:x=>x>=1?1:1-Math.pow(2,-10*x), iE:x=>x<=0?0:Math.pow(2,10*x-10),
 oB:x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
 oQ:x=>1-Math.pow(1-x,5),
};
const lerp=(a,b,k)=>a+(b-a)*k;
function S(el,o){const{op=1,x=0,y=0,s=1,sx,sy,r=0,b=0,top}=o;
 if(top!==undefined)el.style.top=top+'px';
 el.style.opacity=op;
 el.style.visibility=op<=0.002?'hidden':'visible';
 if(op<=0.002)return;
 el.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) rotate(${r}deg) scale(${sx??s},${sy??s})`;
 el.style.filter=b>0.15?`blur(${b.toFixed(1)}px)`:'none';
}
// mulberry32
function rnd(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- palette ----------
const ACC=[['#ff5a36','#ffa21f'],['#ff3d8b','#ff7a59'],['#a63cf0','#ff3d8b'],['#3d5bff','#2fb4ff']];
const gradOf=(a,deg=135)=>`linear-gradient(${deg}deg,${a[0]},${a[1]})`;

// ---------- SVG pieces ----------
const WING_PATHS=[
 {d:'M5,300 C40,190 120,125 225,82 C330,40 362,30 402,5 C392,58 372,108 318,128 C230,150 130,180 60,248 C35,272 15,290 5,300 Z',g:['#ff3b3b','#ff7a1a','#ff9d1f']},
 {d:'M5,358 C45,276 130,222 230,196 C290,181 322,172 346,160 C336,198 318,238 288,246 C220,258 142,272 86,302 C50,322 22,340 5,358 Z',g:['#8a3ee6','#d23ca8','#f23d86']},
 {d:'M6,398 C46,330 130,300 210,292 C250,288 270,283 290,280 C281,312 262,342 230,346 C190,344 140,338 100,346 C60,356 30,374 6,398 Z',g:['#3a44e0','#3264ec','#2f8cf0']},
];
let wingCount=0;
function wingSVG(){const id='w'+(wingCount++);
 let defs='',body='';
 WING_PATHS.forEach((p,i)=>{
  defs+=`<linearGradient id="${id}g${i}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="${p.g[0]}"/><stop offset=".55" stop-color="${p.g[1]}"/><stop offset="1" stop-color="${p.g[2]}"/></linearGradient>
  <clipPath id="${id}c${i}"><rect class="clip${i}" x="-10" y="-10" width="0" height="430"/></clipPath>`;
  body+=`<g class="st${i}" clip-path="url(#${id}c${i})"><path d="${p.d}" fill="url(#${id}g${i})"/></g>`;
 });
 return `<svg viewBox="-5 -5 415 415" width="100%" height="100%" style="overflow:visible;filter:drop-shadow(0 0 28px rgba(255,90,140,.45))"><defs>${defs}</defs>${body}</svg>`;
}
function setWing(el,t,starts,dur=0.55){
 starts.forEach((s,i)=>{const k=E.oC(P(t,s,s+dur));
  el.querySelector('.clip'+i).setAttribute('width',k*440);
  const g=el.querySelector('.st'+i);
  g.setAttribute('transform',`translate(${(1-k)*-50},${(1-k)*30})`);
  g.style.opacity=clamp(k*3);
 });
}
const LAM=(dot)=>`<svg class="lam" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0,100 L41,0 L59,0 L100,100 L82,100 L50,21 L18,100 Z" fill="currentColor"/>${dot?'<circle cx="50" cy="74" r="9" fill="#ff3d8b"/>':''}</svg>`;
function wordmark(size){
 const L=[['B','#fff'],['R','#fff'],[LAM(1),'#fff'],['N','#fff'],['D','#fff'],['&nbsp;','#fff'],['B','#ff8a1a'],[LAM(0),'#ff3d8b'],['Y','#3d7bff']];
 return `<div class="wm" style="font-size:${size}px">`+L.map(([c,col])=>`<span style="color:${col}">${c}</span>`).join('')+`</div>`;
}
function animWordmark(el,t,s0,stagger=0.035){
 el.querySelectorAll('.wm span').forEach((sp,i)=>{const k=P(t,s0+i*stagger,s0+i*stagger+0.32);const e=E.oE(k);
  sp.style.opacity=clamp(k*2.5);
  sp.style.transform=`scale(${lerp(2.6,1,e)}) translateY(${lerp(-40,0,e)}px)`;
  sp.style.filter=k<1?`blur(${(1-e)*14}px)`:'none';
 });
}
const ICONS={
 web:'<rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="M2 8.5h20"/><circle cx="5" cy="6.3" r=".5"/><circle cx="7" cy="6.3" r=".5"/><path d="M9.5 12l-2 2 2 2M14.5 12l2 2-2 2M12.8 11.2l-1.6 5.6"/>',
 seo:'<circle cx="10.5" cy="10.5" r="7"/><path d="M15.6 15.6L21 21M7.8 13v-1.6M10.5 13V9.6M13.2 13V7.8"/>',
 brand:'<path d="M12 2.5l6 6.5-3.5 9.5h-5L6 9z"/><circle cx="12" cy="11" r="1.6"/><path d="M12 2.5v6.9M8.5 21.5h7"/>',
 social:'<path d="M4 4h16a2 2 0 012 2v9.5a2 2 0 01-2 2h-9l-5 4v-4H4a2 2 0 01-2-2V6a2 2 0 012-2z"/><path d="M12 14.6s-3.6-2.2-3.6-4.6a1.9 1.9 0 013.6-.8 1.9 1.9 0 013.6.8c0 2.4-3.6 4.6-3.6 4.6z"/>',
 flyer:'<rect x="4.5" y="2" width="15" height="20" rx="2"/><path d="M4.5 14.5l4-4 4 4 2-2 5 5"/><circle cx="14.8" cy="6.8" r="1.6"/>',
 ads:'<path d="M3 10v4a1 1 0 001 1h3l7 4.5v-15L7 9H4a1 1 0 00-1 1z"/><path d="M17.5 9a4.5 4.5 0 010 6M20 6.5a8 8 0 010 11"/><path d="M7 15l1.5 5h2.5l-1.3-4.3"/>',
 content:'<path d="M13.5 2H6a2 2 0 00-2 2v16a2 2 0 002 2h5.5"/><path d="M13.5 2l6 6v3.5M13.5 2v6h6M8 12.5h7M8 16.5h3.5"/><path d="M20 14.2l2 2-6.2 6.3H13.8v-2z"/>',
 host:'<rect x="2.5" y="3" width="15" height="6" rx="1.6"/><rect x="2.5" y="11" width="15" height="6" rx="1.6"/><path d="M6 6h.01M6 14h.01M9 6h5M9 14h3"/><circle cx="18" cy="18" r="4"/><path d="M14 18h8M18 14c1.6 2.4 1.6 5.6 0 8M18 14c-1.6 2.4-1.6 5.6 0 8"/>',
 cro:'<path d="M4 21V16M9 21v-6M14 21v-4M19 21v-9"/><path d="M3 12l5.5-5 4 3L20 3"/><path d="M15 3h5v5"/>',
 globe:'<circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c3 3.3 3 15.7 0 19M12 2.5c-3 3.3-3 15.7 0 19"/>',
 mail:'<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M3 6.5l9 6.5 9-6.5"/>',
 pin:'<path d="M12 22s7-6.4 7-12a7 7 0 00-14 0c0 5.6 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/>',
 phone:'<path d="M21 16.5v3a2 2 0 01-2.2 2 19.5 19.5 0 01-8.5-3 19.2 19.2 0 01-6-6 19.5 19.5 0 01-3-8.6A2 2 0 013.3 1.8h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L7.3 9.6a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/>',
};
const ico=(k,color='#fff',sw=1.7)=>`<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;

const SERVICES=[
 ['web',['WEBSITE DESIGN','&amp; DEVELOPMENT'],'Fast, modern, mobile-first websites'],
 ['seo',['SEO','SERVICES'],'Rank higher. Get found first.'],
 ['brand',['BRANDING &amp;','LOGO DESIGN'],'Identities people remember'],
 ['social',['SOCIAL MEDIA','MANAGEMENT'],'Grow a loyal community'],
 ['flyer',['FLYER &amp; POSTER','DESIGNING'],'Designs that stop the scroll'],
 ['ads',['GOOGLE ADS','&amp; META ADS'],'Ads that convert, ROI you can measure'],
 ['content',['CONTENT','CREATION'],'Stories that sell your brand'],
 ['host',['HOSTING &amp;','DOMAIN SERVICES'],'Secure, fast &amp; reliable'],
 ['cro',['CONVERSION RATE','OPTIMIZATION'],'Turn visitors into customers'],
];
const FOUNDERS=[
 {img:'assets/maruthi.png',name:'K. MARUTHI GUPTA',role:'Managing Director',ph:'99660 61444',acc:ACC[0],bg:'MARUTHI'},
 {img:'assets/vooka.png',name:'VOOKA SATISH GUPTA',role:'Director',ph:'90595 66227',acc:ACC[1],bg:'SATISH'},
 {img:'assets/sridhar.png',name:'KONDURU SRIDHAR',role:'Director',ph:'96400 29764',acc:ACC[3],bg:'SRIDHAR'},
];

// ================= BUILD ELEMENTS =================
// Intro
const flare=mk('','a','width:1400px;height:6px;border-radius:3px;background:linear-gradient(90deg,transparent,#fff 45%,#ffb36b 50%,#fff 55%,transparent);box-shadow:0 0 40px 10px rgba(255,140,80,.6)');
const wing=mk(wingSVG(),'a','width:440px;height:440px');
const introTxt=mk('<div style="font-size:30px;font-weight:600;letter-spacing:.6em;color:rgba(255,255,255,.75)">GET READY TO GROW</div>');
// Logo lockup
const wm1=mk(wordmark(128));
const tag1=mk(`<div style="font-size:34px;font-weight:700;letter-spacing:.42em"><span style="color:#ff8a1a">DEFINE</span> <span style="color:#fff">•</span> <span style="color:#ff3d8b">DESIGN</span> <span style="color:#fff">•</span> <span style="color:#3d7bff">DELIVER</span></div>`);
const tagParts=[...tag1.querySelectorAll('span')];
const div1=mk('<div class="sub" style="font-size:34px;color:rgba(255,255,255,.8)">A Division of <b style="font-weight:600;color:#fff">Jaya Maruthi Technologies</b></div>');
const line1=mk('','a grad','width:520px;height:5px;border-radius:3px');
// Define / Design / Deliver
const cLabel=mk('<div style="font-size:38px;font-weight:700;letter-spacing:.38em;color:rgba(255,255,255,.75)">AT BRAND BAY, WE</div>');
const WORDS=[['DEFINE','clarity','in vision.',ACC[0]],['DESIGN','creativity','in action.',ACC[2]],['DELIVER','excellence','in execution.',ACC[3]]];
const words=WORDS.map(([w,k,rest,acc],i)=>({
 bg:mk(`<div class="outline" style="font-size:330px">${w} ${w} ${w}</div>`),
 ring:mk('','a',`width:520px;height:520px;border-radius:50%;border:8px solid ${acc[1]};box-shadow:0 0 60px ${acc[0]}`),
 w:mk(`<div class="gtext" style="font-size:200px;font-weight:900;letter-spacing:.01em;background-image:${gradOf(acc,90)};filter:drop-shadow(0 10px 40px ${acc[0]}88)">${w}</div>`),
 s:mk(`<div class="sub" style="font-size:66px;font-weight:600"><span style="color:${acc[1]}">${k}</span> ${rest}</div>`),
 num:mk(`<div style="font-size:30px;font-weight:800;letter-spacing:.3em;color:${acc[1]}">0${i+1} — 03</div>`),
}));
// Services title
const svTop=mk('<div style="font-size:30px;font-weight:700;letter-spacing:.5em;color:rgba(255,255,255,.7)">WHAT WE DO</div>');
const svPill=mk('<div class="pill grad" style="font-size:66px">OUR SERVICES</div>');
// service cards
const cards=SERVICES.map(([ic,tt,ds],i)=>{const acc=ACC[i%4];
 const el=mk(`<div class="card">
  <div class="num">0${i+1}</div><div class="of">/ 09</div>
  <div class="ic" style="background:${gradOf(acc)};box-shadow:0 0 0 18px ${acc[0]}22,0 0 0 38px ${acc[0]}11,0 30px 90px ${acc[0]}88">${ico(ic,'#fff',1.6)}</div>
  <div class="tt">${tt.join('<br>')}</div><div class="ds">${ds}</div>
  <div class="bar">${SERVICES.map((_,j)=>`<i style="${j<=i?`background:${gradOf(acc,90)}`:''}"></i>`).join('')}</div>
  <div style="position:absolute;left:60px;right:60px;top:0;height:4px;border-radius:2px;background:${gradOf(acc,90)}"></div>
 </div>`);
 return {el,ic:el.querySelector('.ic'),tt:el.querySelector('.tt'),ds:el.querySelector('.ds')};
});
// grid
const tiles=SERVICES.map(([ic,tt],i)=>{const acc=ACC[i%4];
 return mk(`<div class="tile"><div class="ic" style="background:${gradOf(acc)};box-shadow:0 14px 40px ${acc[0]}77">${ico(ic,'#fff',1.7)}</div><div class="nm">${tt.join(' ')}</div></div>`);
});
const gridTxt=mk('<div class="sub" style="font-size:46px;font-weight:600">Everything your brand needs.<br><span class="gtext grad" style="font-weight:700">One trusted partner.</span></div>','a','text-align:center;white-space:normal;width:1000px');
// Founders
const fTop=mk('<div style="font-size:42px;font-weight:700;letter-spacing:.45em;color:rgba(255,255,255,.8)">MEET THE</div>');
const fPill=mk('<div class="pill grad" style="font-size:92px;padding:26px 70px">FOUNDERS</div>');
const fsl=FOUNDERS.map((f,i)=>({
 bg:mk(`<div class="outline" style="font-size:300px;-webkit-text-stroke:2px ${f.acc[1]}22">${f.bg} ${f.bg} ${f.bg}</div>`),
 glow:mk('','a',`width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,${f.acc[0]}66,transparent 65%)`),
 ring:mk(`<svg viewBox="0 0 800 800" width="800" height="800"><circle cx="400" cy="400" r="390" fill="none" stroke="${f.acc[1]}" stroke-width="3" stroke-dasharray="4 18" stroke-linecap="round" opacity=".8"/><circle cx="400" cy="400" r="360" fill="none" stroke="url(#rg${i})" stroke-width="5" stroke-dasharray="320 1940"/><defs><linearGradient id="rg${i}"><stop offset="0" stop-color="${f.acc[0]}"/><stop offset="1" stop-color="${f.acc[1]}"/></linearGradient></defs></svg>`),
 card:mk(`<div class="portrait" style="background:${gradOf(f.acc)};box-shadow:0 40px 120px ${f.acc[0]}77"><div class="in"><img src="${f.img}"></div></div>`),
 name:mk(`<div class="pill" style="background:${gradOf(f.acc,90)};font-size:54px;padding:20px 54px;letter-spacing:.06em;box-shadow:0 20px 60px ${f.acc[0]}66">${f.name}</div>`),
 role:mk(`<div class="sub" style="font-size:44px;font-weight:600;color:rgba(255,255,255,.9);letter-spacing:.04em">${f.role}</div>`),
 ph:mk(`<div style="display:flex;align-items:center;gap:18px;background:#fff;border-radius:999px;padding:16px 40px 16px 20px;color:${f.acc[0]};font-size:44px;font-weight:800;letter-spacing:.04em;box-shadow:0 16px 50px rgba(0,0,0,.35)"><span style="width:64px;height:64px;border-radius:50%;background:${gradOf(f.acc)};display:flex;align-items:center;justify-content:center"><span style="width:34px;height:34px;display:block">${ico('phone','#fff',2)}</span></span>${f.ph}</div>`),
}));
fsl.forEach(f=>f.img=f.card.querySelector('img'));
const grp=FOUNDERS.map((f,i)=>mk(`<div style="text-align:center;white-space:normal;width:320px">
 <div class="portrait" style="width:300px;height:330px;padding:6px;border-radius:30px;background:${gradOf(f.acc)};box-shadow:0 24px 70px ${f.acc[0]}66"><div class="in" style="border-radius:25px"><img src="${f.img}"></div></div>
 <div style="font-size:27px;font-weight:800;margin-top:26px;line-height:1.2">${f.name.replace(' ','<br>').replace('K.<br>MARUTHI','K. MARUTHI<br>').replace('<br>GUPTA',' GUPTA')}</div>
 <div class="sub" style="font-size:24px;color:${f.acc[1]};margin-top:8px;font-weight:600">${f.role}</div></div>`));
const grpTxt=mk('<div class="sub" style="font-size:48px;font-weight:600">The minds behind <span class="gtext grad" style="font-weight:700">your brand</span></div>');
// CTA
const cta=[
 mk('<div style="font-size:112px;font-weight:800;letter-spacing:.01em">READY TO</div>'),
 mk('<div style="font-size:112px;font-weight:800;letter-spacing:.01em">GROW YOUR</div>'),
 mk('<div class="gtext grad" style="font-size:190px;font-weight:900;filter:drop-shadow(0 10px 50px rgba(255,61,139,.5))">BRAND?</div>'),
 mk('<div class="sub" style="font-size:48px;color:rgba(255,255,255,.85)">Let\'s build it <b style="color:#fff;font-weight:700">together.</b></div>'),
];
// End card
const wing2=mk(wingSVG(),'a','width:300px;height:300px');
